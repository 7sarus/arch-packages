name: Build and publish AUR packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'aurpkgbuilds/**'
      - '.github/workflows/build.yml'
  schedule:
    # GitHub drops/delays scheduled runs under load; hourly attempts make a missed day very unlikely.
    # Already-published versions are skipped by the gate, so most runs are a no-op.
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Check out PKGBUILDs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Prepare builder
        run: |
          pacman -Syu --noconfirm --needed git sudo curl jq
          useradd -m builder
          install -d -m 0755 -o builder -g builder /work/src /work/new
          echo 'builder ALL=(ALL:ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder

      - name: Check for new versions
        id: gate
        run: |
          set -euo pipefail
          assets=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/packages" \
            | grep -o '"name": *"[^"]*"' | cut -d'"' -f4 || true)
          changed=""
          list=""
          for dir in "$GITHUB_WORKSPACE"/aurpkgbuilds/*/; do
            pkg=$(basename "$dir")
            info="$dir/.SRCINFO"
            # makepkg refuses to run as root and needs write access to the PKGBUILD dir, so use a builder-owned copy
            mkdir -p /work/check
            cp -r "$dir" "/work/check/$pkg"
            chown -R builder:builder "/work/check/$pkg"
            su builder -c "cd '/work/check/$pkg' && makepkg --printsrcinfo" | diff -q "$info" - >/dev/null \
              || { echo "$pkg: .SRCINFO is out of date, regenerate with makepkg --printsrcinfo"; exit 1; }
            ver=$(awk -F' = ' '$1 ~ /pkgver$/ {print $2; exit}' "$info")
            rel=$(awk -F' = ' '$1 ~ /pkgrel$/ {print $2; exit}' "$info")
            arch=x86_64
            if awk -F' = ' '$1 ~ /arch$/ {print $2}' "$info" | grep -qx any; then
              arch=any
            fi
            file="$pkg-$ver-$rel-$arch.pkg.tar.zst"
            if printf '%s\n' "$assets" | grep -qx "$file"; then
              echo "$pkg $ver-$rel already published"
            else
              changed="${changed}${changed:+ }$pkg"
              list="$list$pkg $ver-$rel"$'\n'
            fi
          done
          printf '%s' "$list" > /work/build-list
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "will build: ${changed:-nothing}"

      - name: Build packages
        if: steps.gate.outputs.changed != ''
        run: |
          cat > /work/build.sh <<'EOS'
          #!/bin/bash
          set -euo pipefail
          while read -r pkg full; do
            cp -r "/work/aurpkgbuilds/$pkg" "/work/src/$pkg"
            cd "/work/src/$pkg"
            makepkg -s --noconfirm --nocheck --skippgpcheck
            # Ship only the files makepkg names, and only under this directory's name and version
            files=$(makepkg --packagelist)
            for f in $files; do
              case "$(basename "$f")" in
                "$pkg-$full-"*) cp "$f" /work/new/ ;;
                "$pkg-debug-$full-"*) ;;
                *) echo "unexpected package file: $f" >&2; exit 1 ;;
              esac
            done
          done < /work/build-list
          EOS
          chmod +x /work/build.sh
          cp -r "$GITHUB_WORKSPACE/aurpkgbuilds" /work/aurpkgbuilds
          chown -R builder:builder /work
          su builder -c /work/build.sh

      - name: Create package database
        if: steps.gate.outputs.changed != ''
        run: |
          set -euo pipefail
          mkdir -p /work/db && cd /work/db
          api="https://api.github.com/repos/${{ github.repository }}/releases/tags/packages"
          # Rebuild from every published package, not just this run's output
          urls=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" "$api" \
            | jq -r '.assets[].browser_download_url | select(endswith(".pkg.tar.zst"))')
          while read -r url; do curl -fsSLO "$url"; done <<< "$urls"
          [[ $(ls *.pkg.tar.zst | wc -l) -eq $(wc -l <<< "$urls") ]] \
            || { echo "downloaded package count does not match release assets" >&2; exit 1; }
          cp /work/new/*.pkg.tar.zst .
          # Drop packages no longer vendored in this repo
          for f in *.pkg.tar.zst; do
            name=$(tar -xOf "$f" .PKGINFO | awk -F' = ' '/^pkgname/{print $2; exit}')
            [[ -d "$GITHUB_WORKSPACE/aurpkgbuilds/$name" ]] || rm -f "$f"
          done
          repo-add -R arch-packages.db.tar.gz *.pkg.tar.zst
          # repo-add leaves .db/.files as symlinks; publish real copies instead
          rm -f arch-packages.db arch-packages.files
          cp arch-packages.db.tar.gz arch-packages.db
          cp arch-packages.files.tar.gz arch-packages.files

      - name: Publish release
        if: steps.gate.outputs.changed != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: packages
          name: Arch packages
          body: Auto-built from the PKGBUILDs vendored in this repository.
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            /work/new/*.pkg.tar.zst
            /work/db/arch-packages.db
            /work/db/arch-packages.db.tar.gz
            /work/db/arch-packages.files
            /work/db/arch-packages.files.tar.gz
