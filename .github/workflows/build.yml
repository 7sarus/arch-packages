name: Build and publish AUR packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'aurpkgbuilds/**'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Check out PKGBUILDs
        uses: actions/checkout@v4

      - name: Prepare builder
        run: |
          pacman -Syu --noconfirm --needed git sudo curl
          useradd -m builder
          install -d -m 0755 -o builder -g builder /work/src /work/dist
          echo 'builder ALL=(ALL:ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder

      - name: Check for new versions
        id: gate
        run: |
          set -euo pipefail
          assets=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/packages" \
            | grep -o '"name": *"[^"]*"' | cut -d'"' -f4 || true)
          changed=""
          for pkg in zotero-bin helium-browser-bin rstudio-desktop-bin; do
            info="$GITHUB_WORKSPACE/aurpkgbuilds/$pkg/.SRCINFO"
            ver=$(awk -F' = ' '$1 ~ /pkgver$/ {print $2; exit}' "$info")
            rel=$(awk -F' = ' '$1 ~ /pkgrel$/ {print $2; exit}' "$info")
            file="$pkg-$ver-$rel-x86_64.pkg.tar.zst"
            if printf '%s\n' "$assets" | grep -qx "$file"; then
              echo "$pkg $ver-$rel already published"
            else
              changed="${changed}${changed:+ }$pkg"
            fi
          done
          printf '%s' "$changed" > /work/build-list
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "will build: ${changed:-nothing}"

      - name: Build packages
        if: steps.gate.outputs.changed != ''
        run: |
          cat > /work/build.sh <<'EOS'
          #!/bin/bash
          set -euo pipefail
          for pkg in $(cat /work/build-list); do
            cp -r "/work/aurpkgbuilds/$pkg" "/work/src/$pkg"
            (cd "/work/src/$pkg" && makepkg -s --noconfirm --nocheck --skippgpcheck)
            cp "/work/src/$pkg"/*.pkg.tar.zst /work/dist/
          done
          EOS
          chmod +x /work/build.sh
          cp -r "$GITHUB_WORKSPACE/aurpkgbuilds" /work/aurpkgbuilds
          chown -R builder:builder /work
          su builder -c /work/build.sh

      - name: Create package database
        if: steps.gate.outputs.changed != ''
        run: |
          cd /work/dist
          repo-add -R arch-packages.db.tar.gz *.pkg.tar.zst
          # Extract db and files from the tarball so they're available as standalone files
          tar -xzf arch-packages.db.tar.gz -C /work/dist

      - name: Publish release
        if: steps.gate.outputs.changed != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: packages
          name: Arch packages
          body: Auto-built zotero-bin and helium-browser-bin from vendored PKGBUILDs.
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            /work/dist/*.pkg.tar.zst
            /work/dist/arch-packages.db
            /work/dist/arch-packages.db.tar.gz
            /work/dist/arch-packages.files
            /work/dist/arch-packages.files.tar.gz
